
name:  CI/CD · FlowLog Deploy

on:
  push:
    branches:
      - main         
  pull_request:
    branches:
      - main          

env:
  IMAGE_NAME: flowlog-onepage
  CONTAINER_NAME: flowlog-app
  DOCKER_REGISTRY: docker.io

jobs:
  build:
    name: 🔨 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar HTML (lint)
        run: |
          echo "── Verificando estrutura do HTML ──"
          if grep -q '<!DOCTYPE html>' index.html; then
            echo "DOCTYPE encontrado"
          else
            echo "DOCTYPE ausente" && exit 1
          fi
          if grep -q '<title>' index.html; then
            echo "Tag <title> encontrada"
          else
            echo "Tag <title> ausente" && exit 1
          fi
          echo "Lint HTML concluído com sucesso"

      - name: Exibir informações do commit
        run: |
          echo "Commit  : ${{ github.sha }}"
          echo "Autor   : ${{ github.actor }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Mensagem: ${{ github.event.head_commit.message }}"

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build          
    if: github.ref == 'refs/heads/main'   

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspecionar imagem gerada
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker image inspect ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            --format 'Tamanho: {{.Size}} bytes | Criada: {{.Created}}'

  deploy:
    name: Deploy EC2
    runs-on: ubuntu-latest
    needs: docker           
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH na instância EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'REMOTE'
      
            sudo docker stop flowlog-app 2>/dev/null || true
            sudo docker rm   flowlog-app 2>/dev/null || true
      
            echo " Baixando nova imagem..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/flowlog-onepage:latest
         
            echo "Iniciando container..."
            sudo docker run -d \
              --name flowlog-app \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/flowlog-onepage:latest
      
            echo "Container iniciado com sucesso!"
            sudo docker ps --filter name=flowlog-app --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          REMOTE

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: ⏳ Aguardar serviço inicializar
        run: sleep 15

      - name: Verificar one-page no ar (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.AWS_EC2_HOST }}/ \
            --max-time 30 \
            --retry 5 \
            --retry-delay 5)

          echo "Status HTTP recebido: $STATUS"

          if [ "$STATUS" -eq 200 ]; then
            echo "One-page FlowLog está NO AR! Status: $STATUS"
          else
            echo "Falha no health-check. Status: $STATUS"
            exit 1
          fi

      - name: Verificar endpoint /health
        run: |
          RESPONSE=$(curl -s http://${{ secrets.AWS_EC2_HOST }}/health --max-time 10)
          echo "📋 Resposta do /health: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"status":"ok"'; then
            echo "Health endpoint OK!"
          else
            echo " Health endpoint retornou resposta inesperada"
          fi

