
name: CI/CD · FlowLog

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'

  pull_request:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: flowlog-onepage

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint HTML
        run: |
          grep -q '<!DOCTYPE html>' index.html || (echo "DOCTYPE ausente" && exit 1)
          grep -q '<title>' index.html || (echo "Tag <title> ausente" && exit 1)

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'homolog' }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect Image
        run: |
          TAG=${{ github.ref_name == 'main' && 'latest' || 'homolog' }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$TAG
          docker image inspect \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$TAG \
            --format 'Size: {{.Size}} bytes | Created: {{.Created}}'

  deploy-homolog:
    name: Deploy Homolog
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: homologacao

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'REMOTE'

            if ! command -v docker >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

            sudo docker stop flowlog-app 2>/dev/null || true
            sudo docker rm flowlog-app 2>/dev/null || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/flowlog-onepage:homolog

            sudo docker run -d \
              --name flowlog-app \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/flowlog-onepage:homolog
          REMOTE

      - name: Health Check
        run: |
          sleep 10
          curl -f http://${{ secrets.AWS_EC2_HOST }}/

  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: producao

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'REMOTE'

            if ! command -v docker >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

            sudo docker stop flowlog-app 2>/dev/null || true
            sudo docker rm flowlog-app 2>/dev/null || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/flowlog-onepage:latest

            sudo docker run -d \
              --name flowlog-app \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/flowlog-onepage:latest
          REMOTE

      - name: Health Check
        run: |
          sleep 15
          curl -f http://${{ secrets.AWS_EC2_HOST }}
